<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your code is on your machine — what git actually does</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!--
      The only navigation a one-page explainer owes anyone: a way past the
      heading and straight into the thing you came to use. Hidden until it is
      focused, so it costs no surface and still serves a keyboard visitor.
    -->
    <nav aria-label="Skip">
      <a class="skip" href="#stage">Skip to the picture</a>
    </nav>

    <main>
      <h1>Your code is on your machine</h1>

      <!--
        The page is three things: a suggestion, the picture, and an accessible
        mirror of what just happened. Feedback itself lands on the object it
        happened to, inside the picture, because information placed away from
        the thing it describes reads as unrelated.
      -->
      <p data-prompt class="prompt">Open your laptop.</p>

      <div id="stage" data-graph data-testid="interaction" class="stage"></div>

      <p data-said data-testid="output" class="said" aria-live="polite"></p>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
