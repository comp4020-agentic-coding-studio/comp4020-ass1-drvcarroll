<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>How to GIT: An interactive explainer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!--
      The only navigation a one-page explainer owes anyone: a way past the
      heading and straight into the thing you came to use. Hidden until it is
      focused, so it costs no surface and still serves a keyboard visitor.
    -->
    <nav aria-label="Skip">
      <a class="skip" href="#stage">Skip to the picture</a>
    </nav>

    <main>
      <!--
        A title screen the visitor scrolls past. It costs one gesture and buys
        the picture a whole viewport of its own underneath, with nothing above
        it competing for the height.
      -->
      <section class="cover">
        <h1>How to GIT: An interactive explainer</h1>
        <p class="cue" aria-hidden="true">Scroll down</p>
      </section>

      <!--
        Why this exists before a single git verb does: two beats, each a pair
        of lines pinned to one viewport while the section scrolls underneath.
        Read in order regardless of scroll position or motion preference -
        only their opacity is scroll-linked, never their presence.
      -->
      <section class="intro" data-intro>
        <div class="intro-track">
          <div class="intro-beat">
            <p class="intro-line" data-line>Modern codebases are massive.</p>
            <p class="intro-line" data-line>
              Too massive for a single engineer.
            </p>
          </div>
          <div class="intro-beat">
            <p class="intro-line" data-line>
              Collaborative programming is the backbone of the software
              industry.
            </p>
            <p class="intro-line" data-line>
              This is how collaborative coding is managed.
            </p>
          </div>
        </div>
      </section>

      <section class="screen">
        <!--
          The walkthrough. Script moves this into whichever entity it currently
          points at, so the instruction is read beside the thing it names rather
          than at the top of the page. Two parts, because a beginner needs both:
          what to do, and why that is worth doing. Feedback is the other half of
          the pair and lands on the object it happened to, so .said below stays
          out of sight as the accessible mirror.
        -->
        <div data-prompt class="hint" aria-live="polite" hidden>
          <p data-hint-where class="hint-where" hidden></p>
          <p data-hint-do class="hint-do"></p>
          <p data-hint-why class="hint-why"></p>
        </div>

        <div id="stage" data-graph data-testid="interaction" class="stage"></div>

        <p data-said data-testid="output" class="said" aria-live="polite"></p>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
