<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>How to GIT: An interactive explainer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!--
      The only navigation a one-page explainer owes anyone: a way past the
      heading and straight into the thing you came to use. Hidden until it is
      focused, so it costs no surface and still serves a keyboard visitor.
    -->
    <nav aria-label="Skip">
      <a class="skip" href="#stage">Skip to the picture</a>
    </nav>

    <main>
      <h1>How to GIT: An interactive explainer</h1>

      <!--
        The page is the picture. Both lines of prose stay in the DOM and out of
        sight: the suggestion is drawn beside the entity it points at, and
        feedback lands on the object it happened to. These two carry the same
        words to a screen reader, which is the only place they are still read.
      -->
      <p data-prompt class="prompt">Open your Local Device.</p>

      <div id="stage" data-graph data-testid="interaction" class="stage"></div>

      <p data-said data-testid="output" class="said" aria-live="polite"></p>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
